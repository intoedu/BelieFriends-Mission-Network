<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 엘림이레교회</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2317284A'/%3E%3Cpath d='M32 13v38M21 26h22' stroke='%23E0C68C' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blush:#F0EDE2;--card:#FCFBF4;--wine:#17284A;--wine2:#0E1B33;--gold:#B0842E;--ink:#242833;--ink2:#5E6270;--line:#DED7C4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif KR',serif;background:var(--blush);color:var(--ink);
  min-height:100vh;display:grid;place-items:center;padding:40px 24px;word-break:keep-all;line-height:1.7}
.box{max-width:560px;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:56px 34px;box-shadow:0 30px 60px -34px rgba(63,53,30,.45)}
.kick{font-size:.7rem;font-weight:700;letter-spacing:2.6px;color:var(--gold);margin-bottom:16px}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.44;margin-bottom:14px}
p{color:var(--ink2);font-size:.95rem;margin-bottom:28px}
a.btn{display:inline-block;background:var(--wine);color:#fff;text-decoration:none;
  padding:13px 30px;border-radius:40px;font-weight:700;font-size:.92rem}
a.btn:hover{background:var(--wine2)}
small{display:block;margin-top:24px;color:var(--ink2);font-size:.82rem}
small a{color:var(--wine);font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <p class="kick">404 &middot; PAGE NOT FOUND</p>
    <h1>찾으시는 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력되었을 수 있습니다.<br>홈으로 돌아가 다시 찾아봐 주세요.</p>
    <a class="btn" href="/">엘림이레교회 홈으로</a>
    <small>문의 <a href="tel:0260537644">02-6053-7644</a></small>
  </div>
</body>
</html>
